[project]
name = "white-box-synthesis"
version = "0.2.0"
description = "MCP server for source-wording white-box synthesis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ahmed Kishki" }]
keywords = ["mcp", "provenance", "writing", "verification"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = ["mcp>=2.0.0"]

[project.urls]
Homepage = "https://github.com/AhmedKishki/mcp-white-box-synthesis"
Issues = "https://github.com/AhmedKishki/mcp-white-box-synthesis/issues"

[project.scripts]
white-box-synthesis = "white_box_synthesis.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/white_box_synthesis"]
